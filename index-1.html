<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday 🎂</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#07041a;--card:rgba(255,255,255,.08);--text:#fff;--pink:#ff4d9d;--gold:#ffd166;--violet:#8b5cf6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#2a0f5c,var(--bg) 70%);background-color:var(--bg);color:var(--text);font-family:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;overflow-x:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#bg{z-index:0}#fx{z-index:6}
.screen{position:relative;z-index:2;min-height:100vh;display:none;flex-direction:column;align-items:center;justify-content:center;padding:28px 20px;gap:18px}
.screen.on{display:flex;animation:fade .8s}
@keyframes fade{from{opacity:0;transform:scale(.97)}}
.glass{background:var(--card);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:26px;padding:26px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
h1,h2{margin:0}
.grad{background:linear-gradient(90deg,var(--gold),var(--pink),var(--violet),var(--gold));background-size:300%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
@keyframes shine{to{background-position:300%}}
input[type=text]{width:100%;padding:14px;border-radius:14px;border:1.5px solid rgba(255,255,255,.3);background:rgba(0,0,0,.3);color:#fff;font-size:1.1rem;text-align:center;margin:8px 0}
.up{display:block;border:2px dashed rgba(255,255,255,.4);border-radius:16px;padding:16px;cursor:pointer;margin:8px 0}
.up img{width:90px;height:90px;border-radius:50%;object-fit:cover;display:none;margin:0 auto 8px;border:3px solid var(--pink)}
.up input{display:none}
button{background:linear-gradient(135deg,var(--pink),var(--violet));color:#fff;border:0;border-radius:999px;padding:15px 32px;font-size:1.1rem;font-weight:700;cursor:pointer;box-shadow:0 8px 28px rgba(255,77,157,.45);transition:transform .15s}
button:active{transform:scale(.95)}
#cd{font-size:9rem;font-weight:800;animation:pop 1s infinite}
@keyframes pop{0%{transform:scale(.3);opacity:0}30%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:.9}}
.ring{width:min(62vw,250px);aspect-ratio:1;border-radius:50%;padding:6px;background:conic-gradient(var(--gold),var(--pink),var(--violet),var(--gold));box-shadow:0 0 50px rgba(255,77,157,.7);margin:6px 0}
.ring>div{width:100%;height:100%;border-radius:50%;background:#1a0d3a center/cover;display:flex;align-items:center;justify-content:center;font-size:5rem;overflow:hidden}
@keyframes spin{to{transform:rotate(360deg)}}
.float{animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-12px)}}
.ttl{font-size:clamp(2.2rem,11vw,4rem);font-weight:800;line-height:1.05;letter-spacing:2px}
.ttl span{display:inline-block;opacity:0;transform:translateY(40px) rotate(-8deg);animation:let .6s forwards;text-shadow:0 0 25px rgba(255,77,157,.9)}
@keyframes let{to{opacity:1;transform:none}}
.nm{font-size:clamp(1.8rem,9vw,3rem);font-weight:800}
.cake{font-size:7rem;cursor:pointer;position:relative;display:inline-block;animation:fl 2.5s ease-in-out infinite;filter:drop-shadow(0 0 25px rgba(255,209,102,.6))}
.flames{font-size:2.4rem;animation:fk .25s infinite alternate;letter-spacing:6px}
@keyframes fk{to{transform:scale(1.15) rotate(2deg);opacity:.85}}
.wish{background:var(--card);border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:18px;max-width:440px;margin:10px auto;opacity:0;transform:translateY(30px) scale(.95);animation:wi .8s forwards;font-size:1.1rem;line-height:1.5;backdrop-filter:blur(10px)}
@keyframes wi{to{opacity:1;transform:none}}
.fl{position:fixed;bottom:-60px;z-index:3;pointer-events:none;animation:up linear forwards}
@keyframes up{to{transform:translateY(-125vh) rotate(25deg)}}
#mute{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:9;padding:10px 14px;font-size:1.1rem}
.sub{opacity:.8}
.polaroid{background:#fff;color:#3b1a5a;padding:10px 10px 14px;border-radius:10px;transform:rotate(-3deg);box-shadow:0 18px 50px rgba(0,0,0,.55);max-width:250px;margin:10px auto;font-weight:600}.polaroid img{width:100%;border-radius:6px;display:block;margin-bottom:8px}
</style>
</head>
<body>
<canvas id="bg"></canvas><canvas id="fx"></canvas>
<button id="mute" style="display:none">🔊</button>

<section class="screen on" id="s0">
  <div class="sub">✨ Oru special surprise ✨</div>
  <div class="ring float" style="width:min(56vw,220px)"><div class="pic">🎂</div></div>
  <div class="nm grad">Nandhini Purushoth</div>
  <p class="sub">Unga birthday-ku oru gift ready! 🎁</p>
  <button id="go">Open the Surprise 🎉</button>
</section>

<section class="screen" id="s1"><div id="cd" class="grad">3</div></section>

<section class="screen" id="s2">
  <div class="ttl grad" id="t1"></div>
  <div class="ring float"><div class="pic">🎂</div></div>
  <div class="nm grad" id="n1"></div>
  <p class="sub">Unga special day inniku! 🥳</p>
  <button id="nx1">Cake cut pannalaama? 🎂</button>
</section>

<section class="screen" id="s3">
  <h2 class="grad" style="font-size:2rem">Make a wish 🌠</h2>
  <div class="flames" id="fl">🔥🔥🔥</div>
  <div class="cake" id="cake">🎂</div>
  <p class="sub" id="hint">Cake-a tap panni candle-a ooodunga 💨</p>
</section>

<section class="screen" id="s4" style="justify-content:flex-start;padding-top:50px">
  <div class="ring" style="width:130px"><div class="pic">🎂</div></div>
  <h2 class="grad nm" id="n2"></h2>
  <div class="polaroid float"><img id="full" alt="Nandhini"><div>Our Star ⭐</div></div>
  <div id="ws"></div>
  <button id="again">🎆 Again fireworks!</button>
  <p class="sub" style="font-size:.9rem">Made with ❤️ for you</p>
</section>

const fx=$("fx"),f=fx.getContext("2d"),bg=$("bg"),b=bg.getContext("2d");let P=[],S=[];

  b.clearRect(0,0,bg.width,bg.height);S.forEach(s=>{b.globalAlpha=.4+.6*Math.abs(Math.sin(t/900+s.p));b.fillStyle="#fff";b.beginPath();b.arc(s.x,s.y,s.r,0,7);b.fill()});
  f.clearRect(0,0,fx.width,fx.height);P=P.filter(p=>p.l>0);
  P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=p.f;p.vy*=p.f;p.l--;p.a+=.15;f.globalAlpha=Math.min(1,p.l/p.m*1.5);f.fillStyle=p.c;
    if(p.sq){f.save();f.translate(p.x,p.y);f.rotate(p.a);f.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);f.restore()}else{f.beginPath();f.arc(p.x,p.y,p.s,0,7);f.fill()}});

}requestAnimationFrame(draw);
function firework(x=Math.random()*fx.width,y=Math.random()*fx.height*.55+40){

}

  const c=["#ff4d9d","#ffd166","#06d6a0","#38bdf8","#8b5cf6","#fff"];
  for(let i=0;i<n;i++)P.push({x:fx.width/2,y:fx.height*.6,vx:(Math.random()-.5)*18,vy:-Math.random()*18-4,g:.35,f:.985,s:Math.random()*9+5,sq:1,c:c[i%6],l:170,m:170,a:Math.random()*6});

let ac,muted=false,playing=false;
const N={C:261.63,D:293.66,E:329.63,F:349.23,G:392,A:440,B:466.16,H:523.25};
const M=[["C",.75],["C",.25],["D",1],["C",1],["F",1],["E",2],["C",.75],["C",.25],["D",1],["C",1],["G",1],["F",2],["C",.75],["C",.25],["H",1],["A",1],["F",1],["E",1],["D",1],["B",.75],["B",.25],["A",1],["F",1],["G",1],["F",2]];
function music(){
  if(playing)return;playing=true;ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  const beat=.42;let t=ac.currentTime+.1;
  M.forEach(([n,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.type="triangle";o.frequency.value=N[n];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.22,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+d*beat);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d*beat+.05);t+=d*beat});
  setTimeout(()=>{playing=false;if(!muted)music()},(t-ac.currentTime)*1000+800);
}
$("mute").onclick=()=>{muted=!muted;$("mute").textContent=muted?"🔇":"🔊";if(ac)muted?ac.suspend():ac.resume();if(!muted)music()};
/* flow */
const FIRST="Nandhini";let name="Nandhini Purushoth",photo=PH;
$("go").onclick=()=>{
  
  document.querySelectorAll(".pic").forEach(p=>{if(photo){p.textContent="";p.style.backgroundImage=`url(${photo})`}});
  $("n1").textContent=name;$("n2").textContent=name;
  $("mute").style.display="block";music();
  show("s1");let c=3;$("cd").textContent=c;
  const iv=setInterval(()=>{c--;if(c>0){$("cd").textContent=c;$("cd").style.animation="none";void $("cd").offsetWidth;$("cd").style.animation=""}else{clearInterval(iv);reveal()}},1000);
};
function reveal(){
  show("s2");const t=$("t1");t.innerHTML="";
  ["HAPPY","BIRTHDAY"].forEach((w,wi)=>{const l=document.createElement("div");[...w].forEach((ch,i)=>{const s=document.createElement("span");s.textContent=ch;s.style.animationDelay=(wi*.7+i*.08)+"s";l.appendChild(s)});t.appendChild(l)});
  confetti(200);floaters();setTimeout(()=>{firework();firework()},400);fwLoop();
}
$("nx1").onclick=()=>{clearInterval(show_fw);show("s3")};
$("cake").onclick=()=>{
  $("fl").textContent="💨";$("hint").textContent="Wish nadakkum! 💫";
  confetti(260);floaters();for(let i=0;i<5;i++)setTimeout(firework,i*250);
  setTimeout(()=>{
    show("s4");const w=[`🌟 ${FIRST}, intha varusham ellame super-a nadakkanum!`,"💖 Santhosham, health, success – ellame unga kooda irukkanum.","🎯 Unga ella kanavum nanavagattum!","😄 Epavum ippadiye siricha mugathoda iruppeenga!",`🎂 Many many happy returns of the day, ${name}! 🥳`];
    $("ws").innerHTML="";w.forEach((m,i)=>{const d=document.createElement("div");d.className="wish";d.style.animationDelay=(i*1.2)+"s";d.textContent=m;$("ws").appendChild(d)});
    confetti(220);fwLoop();
  },1600);
};
$("again").onclick=()=>{confetti(260);floaters();for(let i=0;i<6;i++)setTimeout(firework,i*220)};
document.querySelectorAll(".pic").forEach(p=>{p.textContent="";p.style.backgroundImage=`url(${PH})`});$("full").src=FULL;$("n1").textContent=name;$("n2").textContent=name;
</script>
